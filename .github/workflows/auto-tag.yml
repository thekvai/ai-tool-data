name: Auto Create Unique Tag for Instant Sync
on:
  push:
    branches: [ main ]
    paths: [ 'user.json' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-and-purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Unique Timestamp Tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 1. Tạo một Tag hoàn toàn mới dựa trên giây hiện tại (VD: v1730352000)
          NEW_TAG="v$(date +%s)"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

          # 2. Vẫn cập nhật tag live và xóa cache nhánh main
          git tag -f live
          git push origin live -f
          sleep 2
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@main/user.json"
