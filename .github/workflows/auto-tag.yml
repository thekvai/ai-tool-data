name: Convert JSON to JS for Script Loader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create user.js and Push to Live Branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Tạo file user.js từ file user.json hiện tại
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("user.json", "utf8").replace(/,\s*([\]}])/g, "$1").trim();
            const data = JSON.parse(raw);
            fs.writeFileSync("user.js", "window.__KV_AUTH_DATA__ = " + JSON.stringify(data) + ";\n");
          '

          # Đẩy sang nhánh live_js và cập nhật tag live
          git checkout -B live_js
          git add user.js
          git commit -m "Update user.js" || true
          git push origin live_js -f

          git tag -f live
          git push origin live -f

          sleep 3
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@live_js/user.js"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@live/user.js"
