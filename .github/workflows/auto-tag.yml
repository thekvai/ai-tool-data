name: Instant Purge and Sync jsDelivr
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Branch and Deep Purge CDN
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 1. Tạo/Cập nhật nhánh phụ 'sync' trỏ thẳng vào commit mới nhất (Nhánh trên jsDelivr dễ xóa cache hơn Tag gấp 10 lần)
          git checkout -B sync
          git push origin sync -f

          # 2. Đợi 5 giây để GitHub đồng bộ hoàn toàn dữ liệu mới
          sleep 5

          # 3. Xóa sạch cache trên cả nhánh @main và @sync bằng API Purge của jsDelivr (Không dùng Tag vì Tag bị jsDelivr khóa cứng)
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@main/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@sync/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data/user.json"

          sleep 3
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@main/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@sync/user.json"
