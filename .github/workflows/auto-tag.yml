name: Update Live Data
on:
  push:
    branches: [ main ]
    paths: [ 'user.json' ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to live branch and Purge
        run: |
          TAG="v99999999.0.$(date +%s)"
          git tag $TAG
          git push origin $TAG
          sleep 3
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@main/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@latest/user.json"
