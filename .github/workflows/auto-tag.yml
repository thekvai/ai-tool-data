name: Instant Sync jsDelivr via Auto Version
on:
  push:
    branches: [ main ]
    paths: [ 'user.json' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sequential Version Tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Tìm số tag u_1, u_2, u_3... lớn nhất hiện tại và cộng thêm 1
          LAST_VER=$(git tag -l "u_*" | sed 's/u_//' | sort -n | tail -1)
          if [ -z "$LAST_VER" ]; then
            NEXT_VER=1
          else
            NEXT_VER=$((LAST_VER + 1))
          fi

          NEW_TAG="u_${NEXT_VER}"
          echo "Creating new tag: $NEW_TAG"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
