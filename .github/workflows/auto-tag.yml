name: Sync Zero Cache File
on:
  push:
    branches: [ main ]
    paths: [ 'user.json' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create minute-stamped JSON and Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Xóa các file tạm cũ để kho lưu trữ luôn gọn gàng
          rm -f user_*.json
          
          # Tạo tên file theo số phút hiện tại (VD: user_29891234.json)
          MIN=$(( $(date +%s) / 60 ))
          cp user.json "user_${MIN}.json"
          
          git add -A
          git commit -m "Auto sync user_${MIN}.json [skip ci]" || true
          git push origin main
          
          # Đồng thời gắn Tag theo đúng số phút đó
          git tag -f "v${MIN}"
          git push origin "v${MIN}" -f
          
          # Xóa cache đường dẫn gốc
          sleep 3
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@main/user.json"
