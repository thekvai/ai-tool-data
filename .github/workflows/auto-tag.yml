name: Auto Tag and Purge jsDelivr
on:
  push:
    branches: [ main ]
    paths: [ 'user.json' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-and-purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create new dynamic tag
        run: |
          TAG="v1.0.${{ github.run_number }}"
          git tag -f $TAG
          git push origin $TAG -f
      - name: Purge jsDelivr
        run: |
          sleep 5
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@main/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@latest/user.json"
