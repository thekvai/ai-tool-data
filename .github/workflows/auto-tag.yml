name: Minute Sync jsDelivr

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Branches and Purge CDN
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          NOW_MIN=$(($(date +%s) / 60))
          for i in 0 1 2 3 4 5; do
            TARGET_MIN=$((NOW_MIN + i))
            git checkout -B "m_${TARGET_MIN}"
            git push origin "m_${TARGET_MIN}" -f
          done

          git checkout -B prod_v2
          git push origin prod_v2 -f

          git tag -f live
          git push origin live -f

          sleep 4
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@prod_v2/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@live/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@main/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data/user.json"
