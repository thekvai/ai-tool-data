name: Zero Delay Sync jsDelivr
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instant Window Branch and Purge
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 1. Tính số khung 5 phút hiện tại (300 giây = 5 phút)
          NOW_SLOT=$(($(date +%s) / 300))
          NEXT_SLOT=$((NOW_SLOT + 1))
          NEXT2_SLOT=$((NOW_SLOT + 2))

          # Tạo nhánh mới tinh cho 15 phút hiện tại (Đảm bảo 0 giây cache trên toàn cầu)
          git checkout -B "w_${NOW_SLOT}"
          git push origin "w_${NOW_SLOT}" -f

          git checkout -B "w_${NEXT_SLOT}"
          git push origin "w_${NEXT_SLOT}" -f

          git checkout -B "w_${NEXT2_SLOT}"
          git push origin "w_${NEXT2_SLOT}" -f

          # 2. Cập nhật nhánh @sync cố định cho người dùng đăng nhập sau 15 phút
          git checkout -B sync
          git push origin sync -f

          # 3. Đợi 5 giây rồi Purge sạch cache nhánh @sync và @main trên jsDelivr
          sleep 5
          curl -s -X POST https://purge.jsdelivr.net/ \
            -H "Content-Type: application/json" \
            -d '{"path":["/gh/thekvai/ai-tool-data@sync/user.json","/gh/thekvai/ai-tool-data@main/user.json"]}'
          
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@sync/user.json"
          curl -s "https://purge.jsdelivr.net/gh/thekvai/ai-tool-data@main/user.json"
